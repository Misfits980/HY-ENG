<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<title>내 집 맛보기</title>
<!-- 🏡 생활 모드 맛보기 (L0) — 설계서 claude/hy-eng-plan-life.md
     (v403) 3D 방 + 가구 꾸미기 · (v404) 내 아바타(코드로 만든 블록 인형) · 집↔마당 · 연못 낚시 · 물고기 도감
     게임과 따로 열리는 주소 (proto/house.html) · 아바타·도감·미끼만 이 기기에 저장 -->
<style>
:root{--ink:#fff;--sub:#d9d0f5;--panel:rgba(32,24,58,.94);--line:rgba(255,226,140,.55);--gold:#ffd23f;--ok:#7be39a;--bad:#ff6b7a;--bg:#2a2147}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 12px;pointer-events:none;z-index:3}
.bar.top{top:0;padding-top:max(10px,env(safe-area-inset-top))}
.bar.bot{bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom));justify-content:center;flex-wrap:wrap}
.bar > *{pointer-events:auto}
.btn{white-space:nowrap;appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-weight:800;font-size:15px;min-height:44px;min-width:44px;padding:8px 14px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.35);text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.on{border-color:var(--ok);background:rgba(60,140,90,.94)}
.btn.sm{padding:6px 10px;font-size:18px}
.btn[disabled]{opacity:.4}
.ttl{flex:1;text-align:center;font-weight:900;font-size:16px;text-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none}
.ttl small{display:block;font-size:11px;font-weight:700;color:var(--sub)}
.grp{display:none;gap:6px;flex-wrap:nowrap;justify-content:center}
.bar.bot .btn{padding:8px 10px;font-size:14.5px}
.grp.on{display:flex}
#drawer,.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:2px solid var(--line);padding:12px 12px max(12px,env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-height:72vh;overflow-y:auto}
#drawer.on,.sheet.on{transform:none}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hd b{flex:1;font-size:15px}
#drawer .row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.card{flex:none;width:76px;min-height:84px;border-radius:14px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px 2px}
.card i{font-style:normal;font-size:28px;line-height:1.1}
.card span{font-size:12px;font-weight:800}
.card em{font-style:normal;font-size:11px;color:var(--sub)}
.card[disabled]{opacity:.35}
.avRow{margin:0 0 12px}
.avRow h4{margin:0 0 6px;font-size:13px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:48px;min-height:44px;border-radius:12px;border:2.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;padding:4px 10px}
.chip.col{width:48px;padding:0}
.chip.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,210,63,.35)}
#menu{position:fixed;z-index:5;display:none;gap:6px;transform:translate(-50%,-100%);padding:6px;border-radius:16px;background:var(--panel);border:2px solid var(--line)}
#menu.on{display:flex}
#place{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:none;gap:8px}
#place.on{display:flex}
#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px);z-index:9;background:rgba(20,14,40,.94);border:2px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#fps{position:fixed;left:12px;top:calc(64px + env(safe-area-inset-top));z-index:3;font-size:11px;color:var(--sub);opacity:.8;pointer-events:none}
#fade{position:fixed;inset:0;background:#1a1430;opacity:0;pointer-events:none;z-index:8;transition:opacity .22s}
#fade.on{opacity:1}
#bang{position:fixed;z-index:7;transform:translate(-50%,-100%);font-size:34px;font-weight:900;color:#fff;text-shadow:0 2px 0 #c0392b,0 0 10px rgba(255,80,80,.8);display:none;pointer-events:none}
#bang.on{display:block;animation:bang .25s ease-out}
@keyframes bang{from{transform:translate(-50%,-60%) scale(.4)}to{transform:translate(-50%,-100%) scale(1)}}
#hint{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;background:rgba(20,14,40,.85);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:800;display:none;white-space:nowrap}
#hint.on{display:block}
#quiz{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(10,6,24,.55)}
#quiz.on{display:flex}
#quiz .box{width:min(340px,90vw);background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px;text-align:center}
#quiz .fishBig{font-size:76px;line-height:1.1;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.3) rotate(-20deg)}to{transform:none}}
#quiz p{margin:6px 0 12px;font-weight:800}
#quiz .opts{display:flex;gap:8px;justify-content:center}
#quiz .enBig{font-size:34px;font-weight:900;letter-spacing:.5px;color:#fff}
#quiz .opts .btn{font-size:20px;min-height:52px;min-width:88px}
#quiz .opts .btn.right{background:rgba(60,160,90,.95);border-color:var(--ok)}
#quiz .opts .btn.wrong{background:rgba(170,50,70,.95);border-color:var(--bad)}
#quiz .res{font-size:17px;font-weight:900;margin-top:10px;min-height:24px}
.dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.dexC{border-radius:14px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);padding:8px 4px;text-align:center;min-height:96px}
.dexC i{font-style:normal;font-size:34px;display:block}
.dexC b{display:block;font-size:13px}
.dexC small{display:block;font-size:11px;color:var(--sub)}
.dexC.no i{filter:brightness(0) opacity(.35)}
@media (orientation:landscape) and (max-height:500px){
  .bar.top{padding-top:6px} .bar.bot{padding-bottom:6px} .btn{min-height:40px;font-size:14px;padding:6px 12px}
  #place{bottom:calc(128px + env(safe-area-inset-bottom))}
  #quiz .fishBig{font-size:54px} #quiz .box{padding:12px} #quiz .enBig{font-size:28px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="bar top">
  <a class="btn sm" href="../index.html" aria-label="게임으로">◀</a>
  <div class="ttl" id="ttl">🏠 내 집<small>맛보기</small></div>
  <button class="btn sm" id="bDex" aria-label="물고기 도감">🐟</button>
  <button class="btn sm" id="bCam" aria-label="돌리기">🔄</button>
</div>
<div class="bar bot">
  <div class="grp" id="gRoom"><button class="btn" id="bOut">🚪 마당</button><button class="btn" id="bEdit">✏️ 가구</button><button class="btn" id="bWall">🎨</button><button class="btn" id="bFloor">🟫</button><button class="btn" id="bAv1">👕 나</button></div>
  <div class="grp" id="gYard"><button class="btn" id="bIn">🏠 집</button><button class="btn" id="bBait">🪱 0</button><button class="btn" id="bAv2">👕 나</button></div>
  <div class="grp" id="gFish"><button class="btn" id="bStop">✋ 그만</button></div>
</div>
<div id="drawer">
  <div class="hd"><b>📦 창고 — 눌러서 방에 놓아요</b><button class="btn" id="bDone">✅ 다 했어요</button></div>
  <div class="row" id="inv"></div>
</div>
<div class="sheet" id="avP"><div class="hd"><b>👕 나 꾸미기</b><button class="btn" id="avDone">✅ 다 했어요</button></div><div id="avBody"></div></div>
<div class="sheet" id="dexP"><div class="hd"><b>🐟 물고기 도감 <small id="dexN"></small></b><button class="btn" id="dexDone">닫기</button></div><div class="dexGrid" id="dexBody"></div></div>
<div id="place"><button class="btn" id="pRot">↻ 돌리기</button><button class="btn on" id="pOk">✅ 놓기</button><button class="btn" id="pNo">✕</button></div>
<div id="menu"><button class="btn sm" id="mRot" aria-label="돌리기">↻</button><button class="btn sm" id="mMove" aria-label="옮기기">✋</button><button class="btn sm" id="mBox" aria-label="창고에 넣기">📦</button></div>
<div id="quiz"><div class="box"><div class="fishBig" id="qFish">🐟</div><p id="qAsk"></p><div class="opts" id="qOpts"></div><div class="res" id="qRes"></div></div></div>
<div id="bang">!</div>
<div id="hint"></div>
<div id="toast"></div>
<div id="fps"></div>
<div id="fade"></div>
<script src="../three.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const LOW = (navigator.hardwareConcurrency||4) <= 4;
const WALL_H = 2.7;
let dirty = true;
function toast(t, ms){ const el=$("toast"); el.innerHTML=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"), ms||1800); }
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ───────── 렌더러 · 장면 · 빛 ───────── */
const renderer = new THREE.WebGLRenderer({canvas:$("cv"), antialias:true, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2147);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6a5a8a, 0.75));
scene.add(new THREE.AmbientLight(0xffffff, 0.18));
const sun = new THREE.DirectionalLight(0xffe2b8, 0.85);
sun.castShadow = true; sun.shadow.mapSize.set(LOW?1024:2048, LOW?1024:2048); sun.shadow.bias=-0.0008; sun.shadow.radius=3;
scene.add(sun); scene.add(sun.target);

/* ───────── 재료 ───────── */
function canvasTex(w, h, draw, rep){ const c=document.createElement("canvas"); c.width=w; c.height=h; draw(c.getContext("2d"), w, h);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; if(rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; }
const geoCache = {};
function rbox(w,h,d,r){ const key=[w,h,d,r].join(","); if(geoCache[key]) return geoCache[key];
  r=Math.max(0.005, Math.min(r, w/2-0.01, h/2-0.01, d/2-0.01));
  const iw=w-2*r, ih=h-2*r, cr=Math.min(r, iw/2, ih/2)*0.6, s=new THREE.Shape(), x0=-iw/2, y0=-ih/2;
  s.moveTo(x0+cr,y0); s.lineTo(x0+iw-cr,y0); s.quadraticCurveTo(x0+iw,y0,x0+iw,y0+cr); s.lineTo(x0+iw,y0+ih-cr); s.quadraticCurveTo(x0+iw,y0+ih,x0+iw-cr,y0+ih);
  s.lineTo(x0+cr,y0+ih); s.quadraticCurveTo(x0,y0+ih,x0,y0+ih-cr); s.lineTo(x0,y0+cr); s.quadraticCurveTo(x0,y0,x0+cr,y0);
  const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(0.001,d-2*r), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:3, curveSegments:4});
  g.translate(0,0,-(d-2*r)/2); g.computeVertexNormals(); geoCache[key]=g; return g; }
const matCache = {};
function M(col, opt){ const k=col+(opt?JSON.stringify(opt):""); return matCache[k] || (matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:col, roughness:.75}, opt||{}))); }
function part(g, geo, mat, x,y,z){ const m=new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; g.add(m); return m; }
function cyl(rt,rb,h,seg){ const k="c"+[rt,rb,h,seg]; return geoCache[k] || (geoCache[k]=new THREE.CylinderGeometry(rt,rb,h,seg||20)); }
function sph(r){ const k="s"+r; return geoCache[k] || (geoCache[k]=new THREE.SphereGeometry(r,18,14)); }
function cone(r,h,s){ const k="n"+[r,h,s]; return geoCache[k] || (geoCache[k]=new THREE.ConeGeometry(r,h,s||10)); }

/* ═════════ 장소 1: 🏠 집 (6×6) ═════════ */
const RN = 6;
const roomG = new THREE.Group(); scene.add(roomG);
const FLOORS = [
  {nm:"wood floor", draw(g,w,h){ const cols=["#c98f5a","#bf8450","#d29a64","#b97d4a"], ph=h/4;
      for(let i=0;i<4;i++){ g.fillStyle=cols[i%4]; g.fillRect(0,i*ph,w,ph); g.fillStyle="rgba(80,45,20,.35)"; g.fillRect(0,i*ph,w,3); g.fillRect((i*97)%w,i*ph,3,ph); g.fillStyle="rgba(255,255,255,.06)"; g.fillRect(0,i*ph+6,w,4); } }},
  {nm:"tiles", draw(g,w,h){ const s=w/4; for(let y=0;y<4;y++) for(let x=0;x<4;x++){ g.fillStyle=(x+y)%2?"#f3e6c9":"#8fc3b5"; g.fillRect(x*s,y*s,s,s); } }},
  {nm:"carpet", draw(g,w,h){ g.fillStyle="#b9a2e0"; g.fillRect(0,0,w,h); for(let i=0;i<900;i++){ g.fillStyle=Math.random()<.5?"rgba(255,255,255,.07)":"rgba(70,40,120,.08)"; g.fillRect(Math.random()*w,Math.random()*h,2,2); } }}
];
const WALLS = [
  {nm:"stripes", draw(g,w,h){ g.fillStyle="#fbefd8"; g.fillRect(0,0,w,h); g.fillStyle="#f2dcb6"; for(let x=0;x<w;x+=32) g.fillRect(x,0,14,h); }},
  {nm:"polka dots", draw(g,w,h){ g.fillStyle="#cfe9f7"; g.fillRect(0,0,w,h); g.fillStyle="#fff"; for(let y=16;y<h;y+=40) for(let x=(y/40%2)*20+10;x<w;x+=40){ g.beginPath(); g.arc(x,y,6,0,7); g.fill(); } }},
  {nm:"stars", draw(g,w,h){ g.fillStyle="#d4f3e1"; g.fillRect(0,0,w,h); g.fillStyle="#9ad8b6"; g.font="22px sans-serif"; for(let y=26;y<h;y+=48) for(let x=(y/48%2)*24+8;x<w;x+=48) g.fillText("★",x,y); }}
];
let floorIx=0, wallIx=0;
const floorMat = new THREE.MeshStandardMaterial({roughness:.85}), wallMat = new THREE.MeshStandardMaterial({roughness:.95}), trimMat = M(0xffffff,{roughness:.7});
function setFloor(i){ floorIx=i; if(floorMat.map) floorMat.map.dispose(); floorMat.map=canvasTex(256,256,FLOORS[i].draw,[RN/2,RN/2]); floorMat.needsUpdate=true; dirty=true; }
function setWall(i){ wallIx=i; if(wallMat.map) wallMat.map.dispose(); wallMat.map=canvasTex(256,256,WALLS[i].draw,[RN/2,WALL_H/2]); wallMat.needsUpdate=true; dirty=true; }
{ const slab=new THREE.Mesh(new THREE.BoxGeometry(RN,0.25,RN), floorMat); slab.position.set(RN/2,-0.125,RN/2); slab.receiveShadow=true; roomG.add(slab); }
const walls = [];
for(let side=0; side<4; side++){
  const g=new THREE.Group(), T=0.18;
  const w=new THREE.Mesh(new THREE.BoxGeometry(RN+T, WALL_H, T), wallMat); w.position.y=WALL_H/2; w.receiveShadow=true; w.castShadow=true; g.add(w);
  part(g, new THREE.BoxGeometry(RN+T,0.18,T+0.06), trimMat, 0,0.09,0); part(g, new THREE.BoxGeometry(RN+T+0.04,0.12,T+0.1), trimMat, 0,WALL_H,0);
  if(side===0){ part(g, new THREE.BoxGeometry(1.6,1.2,T+0.08), trimMat, -1.2,1.55,0); part(g, new THREE.BoxGeometry(1.36,0.96,T+0.1), new THREE.MeshBasicMaterial({color:0xaee3ff}), -1.2,1.55,0); part(g, new THREE.BoxGeometry(0.06,0.96,T+0.12), trimMat, -1.2,1.55,0); }
  if(side===0) g.position.set(RN/2,0,-T/2); if(side===2){ g.position.set(RN/2,0,RN+T/2); g.rotation.y=Math.PI; }
  if(side===1){ g.position.set(RN+T/2,0,RN/2); g.rotation.y=-Math.PI/2; } if(side===3){ g.position.set(-T/2,0,RN/2); g.rotation.y=Math.PI/2; }
  g.userData.normal=[[0,1],[-1,0],[0,-1],[1,0]][side]; roomG.add(g); walls.push(g);
}
setFloor(0); setWall(0);
const gridLines = (()=>{ const pts=[]; for(let i=0;i<=RN;i++) pts.push(i,0.012,0, i,0.012,RN, 0,0.012,i, RN,0.012,i);
  const g=new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pts,3));
  const l=new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:.35})); l.visible=false; roomG.add(l); return l; })();

/* 가구 — sz = [가로, 세로] 칸 · 앞 = +z */
const WOOD=0xb07a4a, WOOD2=0x8a5a34, CREAM=0xfff3dd;
const ITEMS = {
  bed:{nm:"bed", ic:"🛏️", sz:[1,2], build(){ const g=new THREE.Group();
    part(g, rbox(0.96,0.32,1.96,0.06), M(WOOD), 0,0.2,0); part(g, rbox(0.9,0.2,1.86,0.08), M(0xffffff), 0,0.44,0);
    part(g, rbox(0.92,0.16,1.2,0.07), M(0x6ec3ff), 0,0.52,0.36); part(g, rbox(0.6,0.14,0.34,0.07), M(CREAM), 0,0.6,-0.68);
    part(g, rbox(0.98,0.9,0.12,0.05), M(WOOD), 0,0.45,-0.95); return g; }},
  desk:{nm:"desk", ic:"🗄️", sz:[2,1], build(){ const g=new THREE.Group(), w=1.9, d=0.8;
    part(g, rbox(w,0.08,d,0.03), M(WOOD), 0,0.76,0);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>part(g, rbox(0.08,0.72,0.08,0.02), M(WOOD2), a*(w/2-0.08),0.36,b*(d/2-0.08)));
    part(g, rbox(0.6,0.24,0.7,0.03), M(WOOD), 0.55,0.6,0); part(g, sph(0.035), M(0xffd23f,{metalness:.4}), 0.55,0.6,0.37);
    part(g, rbox(0.34,0.24,0.04,0.02), M(0x333344), -0.45,0.92,-0.15); part(g, rbox(0.34,0.02,0.24,0.01), M(0x555566), -0.45,0.81,0.0); return g; }},
  chair:{nm:"chair", ic:"🪑", sz:[1,1], build(){ const g=new THREE.Group();
    part(g, rbox(0.52,0.08,0.52,0.04), M(0xff8a65), 0,0.46,0);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>part(g, rbox(0.06,0.44,0.06,0.02), M(WOOD2), a*0.2,0.22,b*0.2));
    part(g, rbox(0.52,0.5,0.07,0.04), M(0xff8a65), 0,0.75,-0.23); return g; }},
  shelf:{nm:"bookshelf", ic:"📚", sz:[1,1], build(){ const g=new THREE.Group(), z0=-0.22, D=0.42;
    part(g, rbox(0.9,1.8,0.04,0.01), M(WOOD2), 0,0.9,z0-D/2+0.02);
    part(g, rbox(0.06,1.8,D,0.02), M(WOOD), -0.42,0.9,z0); part(g, rbox(0.06,1.8,D,0.02), M(WOOD), 0.42,0.9,z0);
    part(g, rbox(0.9,0.06,D,0.02), M(WOOD), 0,1.8,z0); part(g, rbox(0.9,0.08,D,0.02), M(WOOD), 0,0.04,z0);

function findPath(sx, sz, tx, tz){

  const rDiff=Math.abs(((hero.face-hero.g.rotation.y+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI);
  if(rDiff>0.01){ hero.g.rotation.y=angTo(hero.g.rotation.y, hero.face, Math.min(1,dt*12)); anim=true; }
  // 동작
  hero.t+=dt; const t=hero.t, B=hero.body;
  let la=0, ra=0, ll=0, lr=0, bob=0, rod=null, hop=0;
  if(hero.moving){ const s=Math.sin(t*11); ll=s*0.65; lr=-s*0.65; la=-s*0.55; ra=s*0.55; bob=Math.abs(Math.cos(t*11))*0.045; }
  else if(hero.act==="cast"){ const k=Math.min(1,hero.actT/0.45); ra=-2.6+k*1.7; rod=-0.5+k*1.6; anim=true; }
  else if(hero.act==="wait"){ ra=-0.85+Math.sin(t*2)*0.03; rod=1.05+Math.sin(t*2)*0.03; la=-0.3; }
  else if(hero.act==="reel"){ const k=Math.min(1,hero.actT/0.5); ra=-0.9-k*1.3; rod=1.05-k*1.0; la=-0.6; anim=true; }
  else if(hero.act==="yay"){ la=ra=-2.8+Math.sin(t*14)*0.15; hop=Math.abs(Math.sin(t*9))*0.12; anim=true; }
  else { la=Math.sin(t*1.8)*0.04; ra=-la; bob=Math.sin(t*2)*0.008; }
  hero.actT+=dt;
  const k=Math.min(1,dt*14);
  hero.legL.rotation.x+= (ll-hero.legL.rotation.x)*k; hero.legR.rotation.x+=(lr-hero.legR.rotation.x)*k;
  hero.armL.rotation.x+= (la-hero.armL.rotation.x)*k; hero.armR.rotation.x+=(ra-hero.armR.rotation.x)*k;
  B.position.y=bob+hop;
  hero.rod.visible = rod!==null; if(rod!==null) hero.rod.rotation.x += (rod-hero.rod.rotation.x)*Math.min(1,dt*16);
  if(markerT>0){ markerT-=dt; marker.material.opacity=Math.max(0,markerT/0.6)*0.8; if(markerT<=0) marker.visible=false; anim=true; }
  return anim;
}

function nearestWater(x,z, px,pz){ let best=null, bd=1e9; for(let a=POND.x0;a<=POND.x1;a++) for(let b=POND.z0;b<=POND.z1;b++){ const d=(a-x)**2+(b-z)**2 + 0.2*((a-px)**2+(b-pz)**2); if(d<bd){ bd=d; best=[a,b]; } } return best; }

function selectP(p){ unselect(); sel=p; p.obj.traverse(m=>{ if(m.isMesh && m.material && m.material.emissive){ m.userData.em=m.material; m.material=m.material.clone(); m.material.emissive=new THREE.Color(0x553300); } }); placeMenu(); dirty=true; }
function unselect(){ if(!sel) return; sel.obj.traverse(m=>{ if(m.userData.em){ m.material.dispose(); m.material=m.userData.em; delete m.userData.em; } }); sel=null; $("menu").classList.remove("on"); dirty=true; }
function placeMenu(){ if(!sel) return; const [w,d]=fp(sel.id,sel.r), v=new THREE.Vector3(sel.x+w/2,1.6,sel.z+d/2).project(camera); const el=$("menu"); el.style.left=((v.x+1)/2*innerWidth)+"px"; el.style.top=Math.max(70,(1-v.y)/2*innerHeight)+"px"; el.classList.add("on"); }

/* ═════════ 나 꾸미기 ═════════ */
function drawAv(){
  const row=(k,t,list,isCol)=>'<div class="avRow"><h4>'+t+'</h4><div class="chips">'+list.map((v,i)=>{ const val=isCol?i:v[0], on=av[k]===val;
    return '<button class="chip'+(isCol?' col':'')+(on?' on':'')+'" data-k="'+k+'" data-v="'+val+'"'+(isCol?' style="background:'+v+'" aria-label="색 '+(i+1)+'"':'')+'>'+(isCol?'':v[1])+'</button>'; }).join("")+'</div></div>';
  $("avBody").innerHTML=row("skin","피부",AV_OPT.skin,true)+row("hair","머리 모양",AV_OPT.hair)+row("hc","머리 색",AV_OPT.hc,true)+row("top","옷 색",AV_OPT.top,true)+row("hat","모자",AV_OPT.hat);
}
$("avBody").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; const k=b.dataset.k, v=b.dataset.v; av[k]=/^\d+$/.test(v)?+v:v; store("hyeng_proto_av", av); makeHero(); drawAv(); hero.act="yay"; hero.actT=0; setTimeout(()=>{ if(hero.act==="yay") hero.act="idle"; },700); });
function openAv(){ if(F.st!=="idle") return; setEdit(false); drawAv(); $("avP").classList.add("on"); avOpen=true; hero.path=[]; hero.moving=false; hero.face=yaw; viewOff(); }
function closeAv(){ $("avP").classList.remove("on"); if(avOpen){ avOpen=false; viewOff(); } }

/* ═════════ 누르기 ═════════ */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), floorPlane=new THREE.Plane(new THREE.Vector3(0,1,0), 0);
function cellAt(e){ ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera); const hit=new THREE.Vector3(); if(!ray.ray.intersectPlane(floorPlane, hit)) return null; const x=Math.floor(hit.x), z=Math.floor(hit.z); return (x>=0&&z>=0&&x<place.N&&z<place.N)?[x,z]:null; }
function itemAt(e){ ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera); const h=ray.intersectObjects(placed.map(p=>p.obj), true); return h.length ? h[0].object.userData.p : null; }
function hitHouse(e){ ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera); return ray.intersectObject(scene.userData.houseObj, true).length>0; }
function sheetOpen(){ return $("avP").classList.contains("on") || $("dexP").classList.contains("on"); }
let down=null;
$("cv").addEventListener("pointerdown", e=>{ down={x:e.clientX, y:e.clientY}; if(F.st!=="idle" && F.st!=="quiz" && F.st!=="reel"){ tapWhileFishing(); down=null; } });
$("cv").addEventListener("pointerup", e=>{
  if(!down || Math.hypot(e.clientX-down.x, e.clientY-down.y)>14){ down=null; return; } down=null;
  if(sheetOpen()){ closeAv(); $("dexP").classList.remove("on"); return; }
  if(place===PL.room){
    if(ghost){ const c=cellAt(e); if(c){ const [w,d]=fp(ghost.id,ghost.r); ghost.x=Math.min(Math.max(0,c[0]-Math.floor((w-1)/2)),RN-w); ghost.z=Math.min(Math.max(0,c[1]-Math.floor((d-1)/2)),RN-d); updGhost(); } return; }
    if(edit){ const p=itemAt(e); if(p) selectP(p); else unselect(); return; }
    const c=cellAt(e); if(c) walkTo(c[0], c[1]); return;
  }
  // 마당
  if(F.st!=="idle") return;
  if(hitHouse(e)){ walkTo(DOOR[0], DOOR[1], ()=>go("room")); return; }
  const c=cellAt(e); if(!c) return;
  if(isWater(c[0], c[1])){ tryFish(c[0], c[1]); return; }
  if(isHouse(c[0], c[1])){ walkTo(DOOR[0], DOOR[1], ()=>go("room")); return; }
  walkTo(c[0], c[1]);
});
$("inv").addEventListener("click", e=>{ const b=e.target.closest(".card"); if(b && !b.disabled) startGhost(b.dataset.id, null); });
$("pRot").onclick=()=>{ if(!ghost) return; ghost.r=(ghost.r+1)%4; const [w,d]=fp(ghost.id,ghost.r); ghost.x=Math.min(ghost.x,RN-w); ghost.z=Math.min(ghost.z,RN-d); updGhost(); };
$("pOk").onclick=okGhost; $("pNo").onclick=cancelGhost;
$("mRot").onclick=()=>{ if(!sel) return; const p=sel, r=(p.r+1)%4, [w,d]=fp(p.id,r), x=Math.min(p.x,RN-w), z=Math.min(p.z,RN-d); if(fits(p.id,x,z,r,p)){ p.r=r; p.x=x; p.z=z; posObj(p.obj,p.id,x,z,r); placeMenu(); dirty=true; } else toast("돌릴 자리가 모자라요 — ✋ 옮긴 다음 돌려 봐요"); };
$("mMove").onclick=()=>{ if(!sel) return; const p=sel; unselect(); startGhost(p.id, p); };
$("mBox").onclick=()=>{ if(!sel) return; const p=sel; unselect(); removePlaced(p); stock[p.id]++; drawInv(); toast("📦 창고에 넣었어요"); };
$("bEdit").onclick=()=>setEdit(true); $("bDone").onclick=()=>setEdit(false);
$("bWall").onclick=()=>{ setWall((wallIx+1)%WALLS.length); toast("🎨 "+WALLS[wallIx].nm); };
$("bFloor").onclick=()=>{ setFloor((floorIx+1)%FLOORS.length); toast("🟫 "+FLOORS[floorIx].nm); };
$("bCam").onclick=()=>{ yawTo+=Math.PI/2; unselect(); };
$("bOut").onclick=()=>go("yard"); $("bIn").onclick=()=>walkTo(DOOR[0], DOOR[1], ()=>go("room"));
$("bAv1").onclick=openAv; $("bAv2").onclick=openAv; $("avDone").onclick=closeAv;
$("bDex").onclick=()=>{ if(F.st!=="idle") return; drawDex(); $("dexP").classList.add("on"); }; $("dexDone").onclick=()=>$("dexP").classList.remove("on");
$("bBait").onclick=()=>{ setBait(bait+5); toast("🪱 미끼 +5 (맛보기)<br><small>게임에서는 공부해야 생겨요 · Daily 30 한 판 = 5개</small>", 2400); };
$("bStop").onclick=()=>{ if(F.st==="wait"||F.st==="cast") endFish("그만했어요 — 미끼는 돌려받았어요", true); else if(F.st==="bite") endFish(null,false); };

/* ═════════ 시작 ═════════ */
makeHero();
[["rug",2,2,0],["bed",0,0,0],["shelf",2,0,0],["plant",5,0,0],["desk",3,0,0],["chair",3,1,2]].forEach(([id,x,z,r])=>{ if(fits(id,x,z,r)){ addPlaced(id,x,z,r); stock[id]--; } });
drawInv(); setBait(bait); setShadow(); resize(); setGroups();
let last=performance.now(), fN=0, fT=0, idleT=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  let anim=updateHero(dt); if(updateFish(dt)) anim=true;
  if(Math.abs(yawTo-yaw)>0.001){ yaw+=(yawTo-yaw)*Math.min(1,dt*8); if(Math.abs(yawTo-yaw)<0.002) yaw=yawTo; if(sel) placeMenu(); anim=true; if(avOpen) hero.face=yaw; }
  if(updCam(dt)) anim=true;
  // 마당 물결 (가만히 있어도 1초에 8번만)
  if(place===PL.yard){ const w=scene.userData.water; w.material.color.setHSL(0.54, 0.62, 0.6+Math.sin(now*0.0012)*0.025); idleT+=dt; if(idleT>0.125){ idleT=0; dirty=true; } }
  if(anim) dirty=true;
  if(!dirty){ fT+=dt; if(fT>1){ $("fps").textContent="멈춤 — 안 그림"; fT=0; fN=0; } return; }
  renderer.render(scene, camera); dirty=false;
  fN++; fT+=dt; if(fT>=1){ $("fps").textContent=Math.round(fN/fT)+" fps"; fN=0; fT=0; }
}
requestAnimationFrame(loop);
window.HOUSE = {makeHero, setAv:(o)=>{ Object.assign(av,o); makeHero(); dirty=true; }, openAv, closeAv, placed, stock, ITEMS, FISH, F, hero:()=>hero, walkTo, fits, findPath, go, place:()=>place.key, tryFish, bite, tapWhileFishing, dex:()=>dex, bait:()=>bait, setBait, av:()=>av, camera, scene, renderer};
</script>
</body>
</html>
