<!doctype html><meta charset="utf-8"><title>ANI preview</title>
<style>body{margin:0;background:#9fd8ff}canvas{display:block}</style>
<script src="../../three.min.js"></script>
<script src="../../proto/isle-ani.js"></script>
<body>
<script>
/* (v694) 🐾 움직이는 동물 미리 보기 — ?k=fox,cow&a=Walk  (테스트 서버로 열기) */
ANI.B="../../assets/town/ani/";
const q=new URLSearchParams(location.search), KS=(q.get("k")||"cow,bull,horse,pony,deer,donkey,fox,wolf,shiba").split(","), AN=q.get("a")||"Idle";
const W=innerWidth, H=innerHeight, R=new THREE.WebGLRenderer({antialias:true}); R.setSize(W,H); R.outputEncoding=THREE.sRGBEncoding; R.shadowMap.enabled=true; document.body.appendChild(R.domElement);
const S=new THREE.Scene(), C=new THREE.PerspectiveCamera(35, W/H, .1, 200); C.position.set(0, 3.2, 10.5); C.lookAt(0,.55,0);
S.add(new THREE.HemisphereLight(0xffffff, 0x88aa66, .7)); const sun=new THREE.DirectionalLight(0xffffff, .9); sun.position.set(4,8,6); sun.castShadow=true; S.add(sun);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.MeshStandardMaterial({color:0x7ccf5a})); gr.rotation.x=-Math.PI/2; gr.receiveShadow=true; S.add(gr);
const HT={cow:1.35, bull:1.4, horse:1.6, pony:1.15, deer:1.3, donkey:1.2, fox:.7, wolf:.9, shiba:.65, husky:.8};
const A=[]; window.A=A;
Promise.all(KS.map(k=>ANI.load(k))).then(()=>{ KS.forEach((k,i)=>{ const a=ANI.make(k,{h:HT[k]||1}); if(!a) return; const n=KS.length, x=(i-(n-1)/2)*1.75; a.g.position.set(x,0,(i%2)*1.6-.8); a.g.rotation.y=.6; a.play(AN,0); S.add(a.g); A.push(a); }); window.READY=1; });
let t0=performance.now(); (function loop(){ const t=performance.now(), dt=Math.min(.05,(t-t0)/1000); t0=t; A.forEach(a=>a.tick(dt)); R.render(S,C); requestAnimationFrame(loop); })();
</script>
