<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>수정 왕국 모험 (시험판)</title>
<style>
:root{--font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;--gold:#ffd27a;--ink:#140f2e;--panel:#1a1438ee;--line:#3b3170}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0a1e;overflow:hidden;font-family:var(--font);color:#fff;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%}
#ov{pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,#0a061a66 100%);transition:background .6s}
button{font-family:var(--font)}
kbd{font:800 10px var(--font);background:#0008;border:1px solid #fff3;border-radius:4px;padding:0 4px;color:#ffe6a8}
.hide{display:none!important}

/* 왼쪽 위: 나 */
#hud{position:fixed;left:12px;top:12px;display:flex;gap:10px;align-items:center;padding:6px 14px 6px 6px;border-radius:16px;background:linear-gradient(180deg,#241b4ef0,#150f30f0);border:2px solid #0a0718;box-shadow:0 0 0 1px #4a3d8c inset,0 6px 18px #0006}
#face{width:56px;height:56px;border-radius:12px;border:2px solid var(--gold);background:#2b2258}
#hud .info{display:flex;flex-direction:column;gap:5px;min-width:170px}
#hud .nm{font-size:14px;font-weight:900;display:flex;gap:6px;align-items:baseline}
#hud .nm span{font-size:12px;color:#c8bdff;font-weight:700}
.hp{position:relative;height:16px;border-radius:8px;background:#0009;border:1px solid #000;overflow:hidden}
.hp i{position:absolute;inset:0;width:100%;background:linear-gradient(180deg,#ff8aa0,#e8355a 55%,#b81f45);transition:width .15s}
.hp b{position:absolute;inset:0;width:100%;background:#fff6;transition:width .6s .2s}
.hp span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:900;line-height:15px;text-shadow:0 1px 2px #000}
#buffs{display:flex;gap:4px;min-height:0}

/* 오른쪽 위 */
#tr{position:fixed;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.gem{display:flex;align-items:center;gap:6px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--panel);border:2px solid #0a0718;font-weight:900;font-size:17px}
.gi{width:20px;height:20px;background:linear-gradient(135deg,#d9fbff,#5fd8ff 45%,#2a8fe0);clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%)}
.mm{position:relative;border-radius:14px;overflow:hidden;border:2px solid #0a0718;box-shadow:0 0 0 1px #4a3d8c inset;background:#0d0a1e}
#mm{width:150px;height:150px}
#zn{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;background:#0a0718cc;font-size:12px;font-weight:900;text-align:center;color:var(--gold)}
#qt{width:230px;display:flex;flex-direction:column;gap:6px}
.q{padding:8px 10px;border-radius:12px;background:#140f2ed9;border:1px solid #3b3170;font-size:12.5px;line-height:1.45}
.q b{display:block;color:var(--gold);font-size:13px;margin-bottom:2px}
.q .ok{color:#7dffb2}
.q.done{border-color:#ffd27a;box-shadow:0 0 12px #ffd27a55}

/* 메뉴 */
#menu{position:fixed;right:12px;bottom:12px;display:flex;gap:6px}
#menu button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:54px;padding:6px 8px;border-radius:12px;border:2px solid #0a0718;background:#2a2158;color:#fff;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #0a0718}
#menu button.pulse{animation:pul 1s infinite}@keyframes pul{50%{box-shadow:0 0 0 3px #ffd27a,0 0 18px #ffd27a}}
#menu button:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0718}

/* 스킬 바 (PC) */
#bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end;padding:8px 10px;border-radius:18px;background:linear-gradient(180deg,#221a4ae6,#120c2ae6);border:2px solid #0a0718;box-shadow:0 0 0 1px #4a3d8c inset,0 8px 24px #0007}
.sk{position:relative;width:62px;height:62px;border-radius:14px;border:2px solid #0a0718;padding:0;background:#2b2258;cursor:pointer;overflow:hidden;box-shadow:0 3px 0 #0a0718;touch-action:none}
.sk canvas{position:absolute;inset:0;width:100%;height:100%}
.sk .cd{position:absolute;inset:0;background:conic-gradient(#000a calc(var(--p,0)*1turn),transparent 0);pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;text-shadow:0 2px 3px #000;pointer-events:none}
.sk kbd{position:absolute;left:3px;top:3px;pointer-events:none}
.sk .n{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;font-weight:800;background:#0009;padding:1px 0;pointer-events:none;white-space:nowrap;overflow:hidden}
.sk .lock{position:absolute;inset:0;background:#0b0820d9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#c8bdff;pointer-events:none}
.sk.big{width:76px;height:76px;border-color:#6b3d00;box-shadow:0 3px 0 #6b3d00}
.sk.flash{animation:skf .5s}
@keyframes skf{0%{box-shadow:0 0 0 4px #fff,0 0 24px #ffd27a}100%{box-shadow:0 3px 0 #0a0718}}
.sk .cnt{position:absolute;right:4px;top:2px;font-size:12px;font-weight:900;text-shadow:0 1px 2px #000;pointer-events:none}
.sep{width:2px;align-self:stretch;background:#3b3170;margin:4px 2px;border-radius:2px}

/* 경험치 */
#xp{position:fixed;left:0;right:0;bottom:0;height:6px;background:#0009}
#xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46e0ff,#a6ffde);box-shadow:0 0 8px #46e0ff;transition:width .3s}

/* 모바일 */
#joy{position:fixed;left:26px;bottom:30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#ffffff14,#ffffff26);border:2px solid #ffffff44;pointer-events:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#cfc6ff);opacity:.75}
body.touch #joy{display:block}
body.touch #bar{left:auto;right:14px;transform:none;bottom:22px;background:none;border:none;box-shadow:none;padding:0;width:236px;height:236px;display:block}
body.touch #bar .sep{display:none}
body.touch .sk{position:absolute;width:58px;height:58px;border-radius:50%}
body.touch .sk.big{width:92px;height:92px;right:0;bottom:0}
body.touch .sk kbd{display:none}
body.touch .sk .n{display:none}
body.touch #menu{bottom:auto;top:12px;right:118px;flex-direction:row}
body.touch #menu button{min-width:46px;padding:5px 6px;font-size:11px}
body.touch #menu kbd{display:none}
body.touch #qt{position:fixed;left:12px;top:84px;width:220px}
body.touch .gem{padding:4px 10px 4px 6px;font-size:15px}
body.touch #mm{width:118px;height:118px}

/* 안내 */
#tip{position:fixed;left:50%;bottom:250px;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:#140f2ef0;border:2px solid var(--gold);font-size:15px;font-weight:900;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:calc(100% - 24px)}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{padding:7px 16px;border-radius:999px;background:#140f2ee6;border:1px solid #4a3d8c;font-size:14px;font-weight:800;animation:tin 2.6s forwards;white-space:nowrap}
@keyframes tin{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#banner{position:fixed;left:0;right:0;top:31%;text-align:center;pointer-events:none;opacity:0}
#banner.on{animation:ban 2.8s forwards}
#banner b{display:block;font-size:46px;font-weight:900;letter-spacing:2px;color:#fff3c4;text-shadow:0 0 18px #ffb84a,0 4px 0 #8a4a10,0 6px 16px #000}
#banner small{display:block;margin-top:8px;font-size:17px;font-weight:800;color:#e6ddff;text-shadow:0 2px 6px #000}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}10%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

/* 대화 */
#dlg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(640px,calc(100% - 24px));display:none;gap:14px;padding:16px;border-radius:20px;background:linear-gradient(180deg,#261d55f7,#150f30f7);border:2px solid var(--gold);box-shadow:0 10px 40px #000a;z-index:20}
#dlg.on{display:flex}
#dlgPic{flex:0 0 84px;height:84px;border-radius:16px;border:2px solid #4a3d8c;background:#2b2258}
#dlg .tx{flex:1;display:flex;flex-direction:column;gap:6px}
#dlgName{font-weight:900;color:var(--gold);font-size:15px}
#dlgText{font-size:15.5px;line-height:1.55;font-weight:600;min-height:48px}
#dlgRw{font-size:13px;color:#7dffb2;font-weight:800}
#dlgBtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{min-height:42px;padding:8px 18px;border-radius:12px;border:2px solid #0a0718;background:#3b2f80;color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #0a0718}
.btn.y{background:linear-gradient(180deg,#ffd75e,#ff9f1a);color:#3a2300;border-color:#6b3d00;box-shadow:0 3px 0 #6b3d00}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}

/* 창 */
#pnl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#05031099;z-index:30}
#pnl.on{display:flex}
#pnl .box{width:min(720px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;padding:18px;border-radius:22px;background:linear-gradient(180deg,#261d55,#150f30);border:2px solid var(--gold);box-shadow:0 20px 60px #000c}
#pnl h2{margin:0 0 12px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.x{width:40px;height:40px;border-radius:12px;border:2px solid #0a0718;background:#3b2f80;color:#fff;font-size:18px;font-weight:900;cursor:pointer}
.eq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.slot{padding:10px;border-radius:14px;background:#0f0b26;border:2px solid #3b3170;min-height:96px;font-size:12.5px;line-height:1.5}
.slot .k{font-size:11px;color:#a99de6;font-weight:800}
.slot .nm{font-size:14px;font-weight:900}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.it{padding:9px;border-radius:12px;background:#0f0b26;border:2px solid #3b3170;font-size:12px;line-height:1.45;cursor:pointer;text-align:left;color:#fff}
.it .nm{font-size:13px;font-weight:900}
.it .up{color:#7dffb2;font-weight:900}.it .dn{color:#ff8aa0;font-weight:900}
.it:hover{border-color:var(--gold)}
.r0{color:#e8e8f0}.r1{color:#6bff8a}.r2{color:#5cb8ff}.r3{color:#c27bff}.r4{color:#ffa63a}
.b0{border-color:#6a6a80!important}.b1{border-color:#2f9e4a!important}.b2{border-color:#2f6fd0!important}.b3{border-color:#8a3fd8!important}.b4{border-color:#e07a10!important;box-shadow:0 0 12px #ff9a2a66}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border-radius:14px;background:#0f0b26;border:2px solid #3b3170;margin-bottom:8px}
.muted{color:#a99de6;font-size:12.5px}

/* 말풍선 고르기 */
#emo{position:fixed;right:12px;bottom:76px;display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:10px;border-radius:16px;background:var(--panel);border:2px solid var(--gold);z-index:25}
#emo.on{display:grid}
#emo button{min-height:44px;padding:6px 12px;border-radius:12px;border:2px solid #0a0718;background:#3b2f80;color:#fff;font-size:15px;font-weight:900;cursor:pointer}
body.touch #toast{bottom:auto;top:130px}
body.touch #emo{bottom:auto;top:200px;right:84px}

#fade{position:fixed;inset:0;background:#05030f;opacity:0;pointer-events:none;transition:opacity .45s;z-index:40}
#fade.on{opacity:1}
#zoneT{position:fixed;left:0;right:0;top:12%;text-align:center;pointer-events:none;opacity:0;z-index:41}
#zoneT.on{animation:zt 3.2s forwards}
#zoneT small{display:block;font-size:14px;font-weight:800;color:#d8ccff;letter-spacing:6px}
#zoneT b{display:block;font-size:42px;font-weight:900;color:#fff;text-shadow:0 0 20px #8a7bff,0 4px 10px #000}
#zoneT i{display:block;margin:8px auto 0;width:220px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
@keyframes zt{0%{opacity:0;letter-spacing:12px}15%{opacity:1;letter-spacing:2px}80%{opacity:1}100%{opacity:0}}

/* 시작 화면 */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:18px 12px 26px;background:linear-gradient(180deg,#0d0a1e00 0%,#0d0a1e00 45%,#0d0a1ecc 75%,#0d0a1e 100%)}
#title h1{position:absolute;top:22px;left:0;right:0;margin:0;text-align:center;font-size:40px;font-weight:900;color:#fff3c4;text-shadow:0 0 22px #ffb84a,0 4px 0 #8a4a10,0 8px 20px #000}
#title h1 small{display:block;font-size:14px;color:#e6ddff;letter-spacing:4px;text-shadow:0 2px 6px #000;margin-top:4px}
.cls{display:flex;gap:12px;width:min(820px,100%)}
.cc{flex:1;min-width:0;padding:14px;border-radius:20px;background:linear-gradient(180deg,#261d55f2,#150f30f2);border:2px solid #3b3170;cursor:pointer;text-align:left;color:#fff;transition:transform .15s,border-color .15s}
.cc:hover,.cc.on{border-color:var(--gold);transform:translateY(-4px);box-shadow:0 0 24px #ffd27a44}
.cc b{display:block;font-size:22px;font-weight:900}
.cc .r{font-size:12px;font-weight:800;color:var(--gold);margin:2px 0 6px}
.cc p{margin:0;font-size:12.5px;line-height:1.5;color:#d8ccff}
.cc .lv{margin-top:8px;font-size:12px;color:#7dffb2;font-weight:800}
#go{margin-top:14px;min-width:240px;min-height:56px;font-size:20px}
@media (max-width:700px){.cls{flex-direction:column;gap:8px}.cc{padding:10px 12px}.cc p{display:none}#title h1{font-size:30px}#qt .q{font-size:11.5px}#hud .info{min-width:120px}#tr .q{display:none}#tr .q:first-child{display:block}}
@media (max-height:520px){#title h1{top:8px;font-size:26px}#title h1 small{font-size:11px}.cc p{display:none}.cc{padding:8px 12px}.cc b{font-size:18px}#go{margin-top:8px;min-height:46px;font-size:17px}#title{padding-bottom:12px}
#zoneT{top:5%}#zoneT b{font-size:28px}#tip{top:128px;bottom:auto;font-size:13px;padding:7px 14px}#banner b{font-size:32px}#banner{top:24%}
body.touch #bar{transform:scale(.82);transform-origin:100% 100%}#hud{padding:4px 10px 4px 4px}#face{width:44px;height:44px}#hud .info{min-width:130px}body.touch #mm{width:104px;height:104px}#dlg{padding:10px;gap:10px}#dlgPic{flex-basis:60px;height:60px}#dlgText{font-size:14px;min-height:0}}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#140f2e;font-size:16px;text-align:center;padding:20px;z-index:99}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="vig"></div>
<div id="hud"><canvas id="face" width="112" height="112"></canvas><div class="info"><div class="nm"><b id="lv">Lv 1</b><span id="cls">검사</span></div><div class="hp"><b id="hpB"></b><i id="hpI"></i><span id="hpT">100 / 100</span></div><div id="buffs"></div></div></div>
<div id="tr"><div class="gem"><span class="gi"></span><b id="gem">0</b></div><div class="mm"><canvas id="mm" width="300" height="300"></canvas><div id="zn">초원 마을</div></div><div id="qt"></div></div>
<div id="menu"><button id="bBag">가방<kbd>I</kbd></button><button id="bEmo">말풍선<kbd>T</kbd></button><button id="bSnd">소리 켬</button></div>
<div id="bar"></div>
<div id="xp"><i id="xpI"></i></div>
<div id="joy"><i id="joyK"></i></div>
<div id="tip"></div>
<div id="toast"></div>
<div id="banner"><b></b><small></small></div>
<div id="dlg"><canvas id="dlgPic" width="168" height="168"></canvas><div class="tx"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgRw"></div><div id="dlgBtns"></div></div></div>
<div id="pnl"><div class="box" id="pnlBox"></div></div>
<div id="emo"></div>
<div id="fade"></div>
<div id="zoneT"><small></small><b></b><i></i></div>
<div id="title"><h1>수정 왕국 모험<small>시험판 · 1장 초원</small></h1><div class="cls" id="clsList"></div><button class="btn y" id="go">모험 시작!</button></div>
<div id="err">이 기기에서는 3D(WebGL2)를 쓸 수 없어요.</div>
<script>
"use strict";
/* =====================================================================
   수정 왕국 모험 — 시험판 RPG (rpg.html 한 파일, 본 게임과 따로)
   - 직접 짠 WebGL2 블록 렌더러: 상자 인스턴싱 + 그림자맵 + 점광원 + 빛 효과 스프라이트
   - 외부 그림·라이브러리 없음 (모든 그림은 코드로 그림)
   ===================================================================== */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, k) => a + (b - a) * k;
const FF = "Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";
const TAU = Math.PI * 2;

const cv = $("gl"), gl = cv.getContext("webgl2", { antialias: true, alpha: false, stencil: true, powerPreference: "high-performance" });
if (!gl) { $("err").style.display = "flex"; throw new Error("no webgl2"); }
const ov = $("ov"), o2 = ov.getContext("2d");
let VW = 0, VH = 0, DPR = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR); ov.width = Math.round(VW * DPR); ov.height = Math.round(VH * DPR); }
addEventListener("resize", resize); resize();

/* ───────────── 그림판 1: 블록 무늬 (32px 칸 16×16) ───────────── */
const AT = document.createElement("canvas"); AT.width = AT.height = 512; const ax = AT.getContext("2d");
let seed = 11; const srnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647, spick = a => a[Math.floor(srnd() * a.length)];
const TL = {}; let tlN = 0;
function tile(name, fn) { const i = tlN++; TL[name] = i; ax.save(); ax.translate((i % 16) * 32, Math.floor(i / 16) * 32); ax.beginPath(); ax.rect(0, 0, 32, 32); ax.clip(); fn(ax); ax.restore(); }
const P2 = (c, x, y, col, w, h) => { c.fillStyle = col; c.fillRect(x * 2, y * 2, (w || 1) * 2, (h || 1) * 2); };       // 16칸 기준 픽셀
function nz(c, base, vars, n) { c.fillStyle = base; c.fillRect(0, 0, 32, 32); for (let k = 0; k < (n || 70); k++) P2(c, Math.floor(srnd() * 16), Math.floor(srnd() * 16), spick(vars)); }
function edge(c, col) { c.fillStyle = col; c.fillRect(0, 30, 32, 2); c.fillRect(30, 0, 2, 32); }
tile("grass", c => nz(c, "#67c24a", ["#5cb240", "#74cf55", "#56a83b", "#80d860"], 95));
tile("grass2", c => nz(c, "#5db544", ["#52a43a", "#6bc44f", "#4b9a34", "#78cf5a"], 95));

    if (h.cls === "bow") { P({ tl: ST.streak, mode: 2, x, y: 1.6, z, bx: x, by: 12, bz: z, s: 0.5, col: CL.green, a: 1, life: 0.3 }); P({ tl: ST.circle, mode: 1, x, y: 0.06, z: z - 0.3, s: 1, s1: 3.4, col: CL.green, a: 0.9, life: 1.4, vr: 1.5, hold: 0.7 }); for (let i = 0; i < 10; i++) later(0.4 + i * 0.07, () => { const a = rnd(0, TAU), r = rnd(0, 1.4); P({ tl: ST.streak, mode: 2, x: x + Math.cos(a) * r + 0.3, y: 5, z: z - 0.3 + Math.sin(a) * r, bx: x + Math.cos(a) * r, by: 0.1, bz: z - 0.3 + Math.sin(a) * r, s: 0.25, col: CL.green, a: 1, life: 0.09 }); }); sfx("bow"); }
    if (h.cls === "mage") { fxRing(x, 0.2, z, 0.3, 4.4, CL.ice, 0.45); P({ tl: ST.star, x, y: 2.7, z, s: 2.4, s1: 0.4, col: CL.white, life: 0.3 }); for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; later(i * 0.01, () => fxSpike(x + Math.cos(a) * 1.6, z + Math.sin(a) * 1.6, 0.9, C("#bff4ff"), WT, 0.8, 1.5)); } sfx("ice"); } } }
function startGame() { ac(); SV.cur = pickCls; me.cls = pickCls; if (!SV.ch[pickCls]) SV.ch[pickCls] = newChar(pickCls); persist(); title = null; $("title").classList.add("hide");
  ["hud", "tr", "menu", "bar", "xp"].forEach(id => $(id).classList.remove("hide")); gameOn = 1; refreshStats(true); drawFace();
  const z = CH().zone && ZONES[CH().zone] && CH().zone !== "ruin" ? CH().zone : "village"; loadZone(z); if (z === "village") { me.x = 30.5; me.z = 46; } me.hp = me.mhp; updHud(); buildBar(); updQuests();
  if (!CH().q.q1) setTimeout(() => toast("촌장 할아버지 머리 위의 ! 를 찾아가요", 1), 1500); }

/* ═════════════ 시작 ═════════════ */
let last = 0, frames = 0;
let manual = 0;
function loop(ts) { const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts; frames++; if (manual) { requestAnimationFrame(loop); return; } try { step(dt); draw(); } catch (e) { console.error(e); window.__err = String(e && e.stack || e); } requestAnimationFrame(loop); }
startTitle(); requestAnimationFrame(loop);
window.__rpg = { me, SV, get mobs() { return mobs; }, get Z() { return Z; }, goZone, loadZone, startGame, useSkill, useBasic, useRoll, spawnMob, talkTo, get npcs() { return npcs; }, openBag, openUpgrade, gainExp, QS, get boss() { return boss; }, set pickCls(v) { pickCls = v; }, bossAtk(k) { boss && startBossAtk(boss, k); }, cam, get title() { return title; }, frames: () => frames, parts: () => parts.length, setMouse(x, y) { mouse.on = 1; mouse.x = x; mouse.y = y; }, manual(v) { manual = v; }, adv(sec) { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) step(1 / 60); draw(); } };
