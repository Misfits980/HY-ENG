<html lang="ko">

<meta charset="utf-8">

<title>HY ENG 사냥터 (시험판)</title>
<style>
:root{--font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
html,body{margin:0;height:100%;background:#0f0b22;overflow:hidden;font-family:var(--font);color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;left:10px;top:10px;display:flex;gap:10px;align-items:center;background:#150f2ecc;border:1px solid #3a3070;border-radius:16px;padding:8px 12px 8px 8px;pointer-events:auto}
.pic{width:46px;height:46px;border-radius:50%;background:#2a2150 no-repeat;background-size:900% 100%;border:2px solid #ffd37a;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:4px;min-width:150px}
.bars b{font-size:13px}
.bar{height:9px;border-radius:9px;background:#00000066;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .2s}
.hpb i{background:linear-gradient(90deg,#ff4f6e,#ff8a9d)}
.exb i{background:linear-gradient(90deg,#5ab8ff,#9fe0ff)}
.gems{position:fixed;right:10px;top:10px;background:#150f2ecc;border:1px solid #3a3070;border-radius:999px;padding:8px 14px;font-weight:900;font-size:16px}
.who{position:fixed;right:10px;top:56px;background:#150f2ecc;border:1px solid #3a3070;border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.6;min-width:120px}
.who em{font-style:normal;color:#7dffb2}
.msg{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:#150f2ee6;border:1px solid #ffd37a;border-radius:14px;padding:8px 16px;font-weight:900;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.msg.on{opacity:1}
.btns{position:fixed;right:18px;bottom:22px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.atk{width:96px;height:96px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffe9a3,#ffb52e 60%,#c97500);color:#3a2300;font:900 18px var(--font);box-shadow:0 6px 0 #8a4f00,0 0 24px #ffb52e66;cursor:pointer}
.atk:active{transform:translateY(3px);box-shadow:0 3px 0 #8a4f00}
.emo{width:56px;height:56px;border-radius:50%;border:1px solid #3a3070;background:#231c4a;color:#fff;font:700 13px var(--font);cursor:pointer}
.quiz{position:fixed;left:50%;bottom:16px;transform:translate(-50%,140%);width:min(560px,calc(100% - 150px));background:#150f2ef2;border:2px solid #ffd37a;border-radius:20px;padding:12px;transition:transform .2s;box-sizing:border-box}
.quiz.on{transform:translate(-50%,0)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.qword{font-size:26px;font-weight:900;letter-spacing:.5px}
.qhint{font-size:12px;color:#b9b0e6}
.qtime{height:6px;border-radius:6px;background:#00000066;margin-bottom:10px;overflow:hidden}
.qtime i{display:block;height:100%;background:#7dffb2;width:100%}
.qopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qopts button{min-height:58px;border-radius:14px;border:1px solid #4a3f8a;background:#2f2766;color:#fff;font:900 17px var(--font);cursor:pointer;padding:4px}
.qopts button.ok{background:#1f8a4c;border-color:#7dffb2}
.qopts button.no{background:#8a1f35;border-color:#ff7d95}
.joy{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff2a;pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#ffffff44}
.tag{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);font-size:11px;color:#ffffff88;pointer-events:none}
@media (max-width:520px){.quiz{width:calc(100% - 20px);bottom:130px}.who{display:none}}
</style>
</head>

  bosses.forEach(B => list.push({ y: B.y, f: () => drawBoss(B) }));
  bots.forEach(b => list.push({ y: b.y, f: () => drawChar(Object.assign({}, b, { name: b.name, lv: b.lv }), false) }));
  Object.values(others).forEach(o => list.push({ y: o.y, f: () => drawChar(o, false) }));
  list.push({ y: me.y, f: () => drawChar(Object.assign({}, me, { lv: save.lv }), true) });
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());
  g.save(); g.globalCompositeOperation = "lighter";
  parts.forEach(p => { const r = Math.min(1, p.age / p.life), a = r < 0.1 ? r / 0.1 : 1 - Math.pow((r - 0.1) / 0.9, 1.5), s = p.s0 + (p.s1 - p.s0) * r; g.globalAlpha = Math.max(0, a);
    if (p.type === "glow") g.drawImage(glow(p.col), p.x - s * 1.5, p.y - s * 1.5, s * 3, s * 3);
    else if (p.type === "ring") { g.globalAlpha = 1 - r; g.strokeStyle = p.col; g.lineWidth = 5 * (1 - r) + 1; g.beginPath(); g.ellipse(p.x, p.y, s, s * 0.7, 0, 0, 6.28); g.stroke(); }
    else if (p.type === "star") { g.drawImage(glow(p.col), p.x - s * 1.4, p.y - s * 1.4, s * 2.8, s * 2.8); g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = "#ffe48a"; g.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? s * 0.45 : s, an = i * Math.PI / 5 - Math.PI / 2; g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); } g.closePath(); g.fill(); g.restore(); }
    else if (p.type === "gem") { g.globalAlpha = 1; g.drawImage(glow("rgba(100,210,255,1)"), p.x - 16, p.y - 16, 32, 32); g.globalCompositeOperation = "source-over"; g.fillStyle = "#7fe0ff"; g.beginPath(); g.moveTo(p.x - 6, p.y - 3); g.lineTo(p.x - 3, p.y - 8); g.lineTo(p.x + 3, p.y - 8); g.lineTo(p.x + 6, p.y - 3); g.lineTo(p.x, p.y + 7); g.closePath(); g.fill(); g.globalCompositeOperation = "lighter"; } });
  g.restore();
  texts.forEach(x => { const r = x.age / 1.2; g.globalAlpha = 1 - r * r; g.font = "900 " + (x.big ? 26 : 18) + "px " + FF; g.textAlign = "center"; g.lineWidth = 4; g.strokeStyle = "rgba(0,0,0,0.6)"; g.strokeText(x.s, x.x, x.y - r * 40); g.fillStyle = x.col; g.fillText(x.s, x.x, x.y - r * 40); }); g.globalAlpha = 1;
  g.restore();
  const B = bosses[0]; if (B) { const bw = Math.min(420, VW - 40), bx = (VW - bw) / 2, by = VW > 760 ? 18 : 64; g.fillStyle = "rgba(20,14,46,0.85)"; g.fillRect(bx - 4, by - 4, bw + 8, 24); g.fillStyle = "#3a2a5a"; g.fillRect(bx, by, bw, 16); g.fillStyle = "#b46cff"; g.fillRect(bx, by, bw * B.hp / B.mhp, 16); g.fillStyle = "#fff"; g.font = "900 12px " + FF; g.textAlign = "center"; g.fillText("필드 보스 " + B.hp + " / " + B.mhp, VW / 2, by + 13); }
  if (flash > 0) { g.fillStyle = "rgba(" + flashCol + "," + Math.min(0.5, flash) + ")"; g.fillRect(0, 0, VW, VH); }
  if (me.dead) { g.fillStyle = "rgba(0,0,0,0.45)"; g.fillRect(0, 0, VW, VH); }
}
function updHud() {
  $("lvTxt").textContent = "Lv " + save.lv + " · " + CHN[me.ch]; $("hpBar").style.width = (me.hp / me.mhp * 100) + "%"; $("exBar").style.width = (save.exp / (50 + save.lv * 30) * 100) + "%";
  $("gems").textContent = "💎 " + save.gems; $("pic").style.backgroundImage = "url(assets/chars/char-portraits.webp)"; $("pic").style.backgroundPosition = (me.ch / 8 * 100) + "% 0";
  const n = Object.keys(others).length;
  $("who").innerHTML = "<b>같이 사냥 중</b><br>" + "<em>●</em> 나 Lv" + save.lv + "<br>" + bots.map(b => "<em>●</em> " + b.name).join("<br>") + (n ? "<br>" + Object.values(others).map(o => "<em>●</em> 다른 탭 Lv" + (o.lv || 1)).join("<br>") : "") + (bosses[0] ? "" : "<br><span style='color:#b9b0e6'>보스까지 " + Math.max(0, Math.ceil(bossT)) + "초</span>");
}
updHud(); say("몬스터를 눌러서 공격해요! 머리 위 단어의 뜻을 맞히면 공격");
let last = 0; function loop(ts) { const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016); last = ts; try { step(dt); draw(); } catch (e) { console.error(e); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__rpg = { me, mons, get bosses() { return bosses; }, attack, answer, spawnBoss, get quiz() { return quiz; }, save };
</script>
