<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HY ENG 블록 사냥터 (시험판)</title>
<style>
:root{--font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
html,body{margin:0;height:100%;background:#8fd0ff;overflow:hidden;font-family:var(--font);color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ov{pointer-events:none}
.hud{position:fixed;left:10px;top:10px;display:flex;gap:10px;align-items:center;background:#1b1440cc;border:2px solid #0d0a22;border-radius:10px;padding:8px 12px 8px 8px}
.pic{width:44px;height:44px;border-radius:8px;border:2px solid #ffd37a;cursor:pointer}
.bars{display:flex;flex-direction:column;gap:4px;min-width:150px}
.bars b{font-size:13px}
.bar{height:10px;border-radius:3px;background:#00000066;overflow:hidden;border:1px solid #00000055}
.bar i{display:block;height:100%;transition:width .2s}
.hpb i{background:#ff4f6e}.exb i{background:#5ab8ff}
.gems{position:fixed;right:10px;top:10px;background:#1b1440cc;border:2px solid #0d0a22;border-radius:10px;padding:8px 14px;font-weight:900;font-size:16px}
.who{position:fixed;right:10px;top:58px;background:#1b1440cc;border:2px solid #0d0a22;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.6;min-width:130px}
.who em{font-style:normal;color:#7dffb2}
.msg{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#1b1440e6;border:2px solid #ffd37a;border-radius:10px;padding:8px 16px;font-weight:900;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.msg.on{opacity:1}
.btns{position:fixed;right:18px;bottom:22px;display:flex;gap:12px;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.atk{width:96px;height:96px;border-radius:18px;border:3px solid #6b3d00;background:linear-gradient(180deg,#ffd75e,#ff9f1a);color:#3a2300;font:900 18px var(--font);box-shadow:0 6px 0 #6b3d00;cursor:pointer}
.atk:active,.jmp:active{transform:translateY(3px)}
.jmp{width:70px;height:70px;border-radius:14px;border:3px solid #0d0a22;background:#3a7bd5;color:#fff;font:900 15px var(--font);box-shadow:0 5px 0 #0d0a22;cursor:pointer}
.emo{width:56px;height:56px;border-radius:12px;border:2px solid #0d0a22;background:#2a2150;color:#fff;font:700 13px var(--font);cursor:pointer}
.quiz{position:fixed;left:50%;bottom:16px;transform:translate(-50%,150%);width:min(560px,calc(100% - 290px));min-width:300px;background:#1b1440f2;border:3px solid #ffd37a;border-radius:14px;padding:12px;transition:transform .2s;box-sizing:border-box}
.quiz.on{transform:translate(-50%,0)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.qword{font-size:26px;font-weight:900}
.qhint{font-size:12px;color:#c9c0ff}
.qtime{height:6px;border-radius:3px;background:#00000066;margin-bottom:10px;overflow:hidden}
.qtime i{display:block;height:100%;background:#7dffb2;width:100%}
.qopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qopts button{min-height:58px;border-radius:10px;border:2px solid #0d0a22;background:#3b2f80;color:#fff;font:900 17px var(--font);cursor:pointer;padding:4px;box-shadow:0 4px 0 #0d0a22}
.qopts button.ok{background:#1f8a4c}.qopts button.no{background:#a3243e}
.joy{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#ffffff66}
.tag{position:fixed;left:50%;top:4px;transform:translateX(-50%);font-size:11px;color:#0d0a22aa;pointer-events:none;white-space:nowrap}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#1b1440;font-size:16px;text-align:center;padding:20px}
@media (max-width:640px){.quiz{width:calc(100% - 20px);bottom:140px}.who{display:none}.tag{display:none}}
</style>
</head>

<div class="hud"><div class="pic" id="pic" title="캐릭터 바꾸기"></div><div class="bars"><b id="lvTxt">Lv 1</b><div class="bar hpb"><i id="hpBar"></i></div><div class="bar exb"><i id="exBar"></i></div></div></div>

    push(A, mul(Tm(w.x, gy + 0.02, w.z), mul(Ry(t * 3), Sm(w.r * 1.8 * (1 - k), 0.02, w.r * 1.8 * (1 - k)))), [1, 0.35, 0.3, 0.8], WT); });
